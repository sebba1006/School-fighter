name: Web build

# Runs the tests, exports the web version and publishes it to GitHub Pages
# every time main changes. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir
          unzip -qj templates.tpz "templates/web_*" "templates/version.txt" -d $dir
          rm templates.tpz

      - name: Run the rules tests
        run: |
          ./godot --headless --path game --import
          ./godot --headless --path game -s res://tests/run_tests.gd

      - name: Run the online smoke test (server + 2, 3 and 4 bots)
        run: |
          for n in 2 3 4; do timeout 120 ./godot --headless --path game -s res://tools/net_smoke.gd -- $n; done

      - name: Export the web version
        run: |
          mkdir -p build/web
          ./godot --headless --path game --export-release "Web" ../build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
